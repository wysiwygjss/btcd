name: Deploy House 3D Tour

on:
  push:
    branches: [cursor/house-blueprint-3d-viewer-102b]
    paths: ['house-tour/**', 'house-blueprint-viewer/**', '.github/workflows/house-viewer-pages.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: house-viewer-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: house-blueprint-viewer/package-lock.json

      - name: Build viewer
        run: |
          cd house-blueprint-viewer
          npm ci
          npm run build
          rm -rf ../house-tour/assets ../house-tour/index.html
          cp -r dist/* ../house-tour/

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: house-tour

      - id: deployment
        uses: actions/deploy-pages@v4
